name: CaptionsAI
options:
  bundleIdPrefix: com.lalitkhatri
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "227747Q2J5" # Set your team ID here
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1" # iPhone only
    INFOPLIST_KEY_CFBundleDisplayName: "CaptionsAI"
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.video"
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_PREVIEWS: "YES"

configs:
  Debug:
    buildSettings:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      DEBUG_INFORMATION_FORMAT: "dwarf"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
  Release:
    buildSettings:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  CaptionsAI:
    type: application
    platform: iOS
    sources:
      - path: CaptionsAI
        excludes:
          - "**/*.md"
    settings:
      base:
        INFOPLIST_FILE: CaptionsAI/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.lalitkhatri.CaptionsAI
        # Must be set here, not only under the project-level settings above:
        # XcodeGen's iOS preset writes TARGETED_DEVICE_FAMILY "1,2" at target
        # level, and target settings win. Left alone, the app ships as
        # Universal while Info.plist only allows portrait, which App Store
        # Connect rejects for iPad multitasking.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "CaptionsAI needs speech recognition to generate captions from your video's audio."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "CaptionsAI needs permission to save exported videos to your photo library."
      configs:
        Debug:
          # Dev builds are marked via the display name, NOT PRODUCT_NAME.
          # Renaming the product renames the .app, which breaks the
          # CaptionsAITests TEST_HOST path
          # ($(BUILT_PRODUCTS_DIR)/CaptionsAI.app/...) and leaves the unit-test
          # bundle with nothing to load into.
          #
          # It has to be a plain build setting read by Info.plist, not
          # INFOPLIST_KEY_CFBundleDisplayName: INFOPLIST_KEY_* only applies
          # when Xcode generates the plist, and this target ships a
          # hand-written one via INFOPLIST_FILE.
          APP_DISPLAY_NAME: "CaptionsAI (Dev)"
        Release:
          APP_DISPLAY_NAME: "CaptionsAI"
          PRODUCT_NAME: "CaptionsAI"
    entitlements:
      path: CaptionsAI/CaptionsAI.entitlements

  CaptionsAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CaptionsAITests
    dependencies:
      - target: CaptionsAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lalitkhatri.CaptionsAITests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CaptionsAI.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/CaptionsAI"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  CaptionsAI:
    build:
      targets:
        CaptionsAI: all
        CaptionsAITests: [test]
    run:
      config: Debug
      storeKitConfiguration: CaptionsAI/Configuration.storekit
      commandLineArguments:
        "-com.apple.CoreData.ConcurrencyDebug 1": true
    test:
      config: Debug
      gatherCoverageData: true
      storeKitConfiguration: CaptionsAI/Configuration.storekit
      targets:
        - CaptionsAITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
